<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>버찌 체스 엔진 테스트</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: 0 auto; padding: 32px 20px; background: #111827; color: #f8fafc; }
    h1 { margin-top: 0; }
    #summary { padding: 14px 16px; border-radius: 8px; background: #1f2937; font-weight: 800; }
    [data-test-status="passed"] #summary { background: #14532d; }
    [data-test-status="failed"] #summary { background: #7f1d1d; }
    ol { padding-left: 24px; }
    li { margin: 8px 0; }
    .pass { color: #86efac; }
    .fail { color: #fca5a5; }
    code { color: #fde68a; }
  </style>
</head>
<body>
  <h1>버찌 체스 엔진 테스트</h1>
  <p id="summary" role="status" aria-live="polite">테스트 실행 중…</p>
  <ol id="results"></ol>
  <script src="../chess-engine.js?v=9"></script>
  <script src="../chess-openings.js?v=1"></script>
  <script src="../chess-ai.js?v=9"></script>
  <script src="engine-tests.js?v=1"></script>
</body>
</html>
