<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25170f">
  <meta name="description" content="버찌와 쩨비가 펼치는 작은 AI 체스 인형극">
  <title>버찌 체스</title>
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <main class="theatre" id="theatre">
    <div class="frame">
      <button class="medallion" type="button" aria-label="음악 장식">♪</button>
      <div class="curtain top" aria-hidden="true"></div>
      <div class="curtain left" aria-hidden="true"><i></i></div>
      <div class="curtain right" aria-hidden="true"><i></i></div>
      <div class="spotlight one" aria-hidden="true"></div>
      <div class="spotlight two" aria-hidden="true"></div>

      <section class="screen title-screen active" id="title-screen" tabindex="-1" aria-label="버찌 체스 타이틀 무대">
        <div class="title-actor title-zzeebi">
          <div class="zzeebi-crop" role="img" aria-label="플레이어의 분신 쩨비"></div>
        </div>

        <div class="title-center">
          <div class="logo" aria-label="버찌 체스">
            <span>버</span><span>찌</span><span class="gap">체</span><span>스</span>
          </div>
          <p class="tagline">A LITTLE CHESS THEATRE</p>
          <nav class="menu" aria-label="주 메뉴">
            <fieldset class="difficulty-picker">
              <legend>AI 난이도</legend>
              <label class="difficulty-option">
                <input type="radio" name="difficulty" value="low">
                <span>하</span>
              </label>
              <label class="difficulty-option">
                <input type="radio" name="difficulty" value="medium" checked>
                <span>중</span>
              </label>
              <label class="difficulty-option">
                <input type="radio" name="difficulty" value="high">
                <span>상</span>
              </label>
            </fieldset>
            <button class="paper-button primary" id="start-game" type="button">AI 대국 시작</button>
            <button class="paper-button" data-modal="how" type="button">게임 방법</button>
            <button class="paper-button" data-modal="credits" type="button">크레딧</button>
          </nav>
        </div>

        <div class="title-actor title-beorjji">
          <div class="beorjji-crop" role="img" aria-label="AI 상대 버찌"></div>
        </div>
      </section>

      <section class="screen game-screen" id="game-screen" tabindex="-1" aria-label="쩨비와 버찌의 체스 대국" aria-hidden="true" inert>
        <div class="game-status paper-card" id="game-status" role="status" aria-live="polite">쩨비의 차례</div>

        <aside class="player-panel zzeebi-panel" aria-label="왼쪽 플레이어 쩨비">
          <div class="zzeebi-crop game-zzeebi" role="img" aria-label="쩨비"></div>
          <span class="name-card">쩨비 · 백</span>
        </aside>

        <div class="board-wrap">
          <div class="chessboard" id="chessboard" role="grid" aria-label="가로 방향 8×8 체스판"></div>
          <div class="game-actions" aria-label="대국 메뉴">
            <button class="paper-button compact" id="hint" type="button">힌트</button>
            <button class="paper-button compact" id="restart" type="button">다시 시작</button>
            <button class="paper-button compact" id="back-title" type="button">타이틀로</button>
          </div>
        </div>

        <aside class="player-panel beorjji-panel" aria-label="오른쪽 AI 버찌">
          <div class="beorjji-crop game-beorjji" role="img" aria-label="버찌"></div>
          <span class="name-card">버찌 · 흑</span>
        </aside>

        <aside class="move-history paper-card" aria-labelledby="move-history-title">
          <div class="move-history-heading">
            <h2 id="move-history-title">기보</h2>
            <span id="move-count">0수</span>
          </div>
          <div class="move-list-scroll" id="move-list-scroll" tabindex="0" aria-label="지금까지 둔 수">
            <table class="move-table">
              <thead>
                <tr><th scope="col">#</th><th scope="col">쩨비</th><th scope="col">버찌</th></tr>
              </thead>
              <tbody id="move-list" aria-live="polite"></tbody>
            </table>
          </div>
        </aside>
      </section>

      <div class="floor" aria-hidden="true"></div>

      <div class="cutscene-layer" id="cutscene-layer" role="dialog" aria-modal="true" aria-labelledby="cutscene-title" aria-describedby="cutscene-copy" aria-hidden="true" inert>
        <div class="cutscene-speedlines" aria-hidden="true"></div>
        <div class="cutscene-actor" id="cutscene-actor" data-side="w" aria-hidden="true"></div>
        <div class="cutscene-card">
          <p class="cutscene-eyebrow" id="cutscene-eyebrow">SPECIAL MOVE</p>
          <h2 id="cutscene-title">특수 상황!</h2>
          <p id="cutscene-copy">임시 컷신 장면입니다.</p>
          <button class="paper-button compact" id="cutscene-skip" type="button">건너뛰기</button>
        </div>
      </div>

      <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true" inert>
        <div class="modal">
          <h2 id="modal-title">게임 방법</h2>
          <div id="modal-copy"></div>
          <button class="paper-button primary" id="close-modal" type="button">무대로 돌아가기</button>
        </div>
      </div>
    </div>
  </main>
  <script src="chess-engine.js?v=3"></script>
  <script src="chess-ai.js?v=2"></script>
  <script src="cutscene-manager.js?v=1"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
