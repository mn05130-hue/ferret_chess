<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25170f">
  <meta name="description" content="버찌와 쩨비가 펼치는 작은 AI 체스 인형극">
  <title>버찌 체스</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="theatre" id="theatre">
    <div class="frame">
      <button class="medallion" type="button" aria-label="음악 장식">♪</button>
      <div class="curtain top" aria-hidden="true"></div>
      <div class="curtain left" aria-hidden="true"><i></i></div>
      <div class="curtain right" aria-hidden="true"><i></i></div>
      <div class="spotlight one" aria-hidden="true"></div>
      <div class="spotlight two" aria-hidden="true"></div>

      <section class="screen title-screen active" id="title-screen" aria-label="버찌 체스 타이틀 무대">
        <div class="title-actor title-zzeebi">
          <div class="zzeebi-crop" role="img" aria-label="플레이어의 분신 쩨비"></div>
        </div>

        <div class="title-center">
          <div class="logo" aria-label="버찌 체스">
            <span>버</span><span>찌</span><span class="gap">체</span><span>스</span>
          </div>
          <p class="tagline">A LITTLE CHESS THEATRE</p>
          <nav class="menu" aria-label="주 메뉴">
            <button class="paper-button primary" id="start-game" type="button">AI 대국 시작</button>
            <button class="paper-button" data-modal="how" type="button">게임 방법</button>
            <button class="paper-button" data-modal="credits" type="button">크레딧</button>
          </nav>
        </div>

        <div class="title-actor title-beorjji">
          <div class="beorjji-crop" role="img" aria-label="AI 상대 버찌"></div>
        </div>
      </section>

      <section class="screen game-screen" id="game-screen" aria-label="쩨비와 버찌의 체스 대국" aria-hidden="true">
        <div class="game-status paper-card" id="game-status" role="status" aria-live="polite">쩨비의 차례</div>

        <aside class="player-panel zzeebi-panel" aria-label="왼쪽 플레이어 쩨비">
          <div class="zzeebi-crop game-zzeebi" role="img" aria-label="쩨비"></div>
          <span class="name-card">쩨비 · 백</span>
        </aside>

        <div class="board-wrap">
          <div class="chessboard" id="chessboard" role="grid" aria-label="가로 방향 8×8 체스판"></div>
          <div class="game-actions" aria-label="대국 메뉴">
            <button class="paper-button compact" id="hint" type="button">힌트</button>
            <button class="paper-button compact" id="restart" type="button">다시 시작</button>
            <button class="paper-button compact" id="back-title" type="button">타이틀로</button>
          </div>
        </div>

        <aside class="player-panel beorjji-panel" aria-label="오른쪽 AI 버찌">
          <div class="beorjji-crop game-beorjji" role="img" aria-label="버찌"></div>
          <span class="name-card">버찌 · 흑</span>
        </aside>
      </section>

      <div class="floor" aria-hidden="true"></div>

      <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal">
          <h2 id="modal-title">게임 방법</h2>
          <div id="modal-copy"></div>
          <button class="paper-button primary" id="close-modal" type="button">무대로 돌아가기</button>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
