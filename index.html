<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <meta name="description" content="라이브 방송용 모바일 채팅 인터페이스">
  <title>Song Studio Live Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="chat-app" aria-label="라이브 채팅">
    <header class="browser-bar" aria-label="현재 방송 주소">
      <svg class="pin-icon" aria-hidden="true" viewBox="0 0 24 24">
        <path d="m15.8 3.2 5 5-2 2-1-.35-3.45 3.45.35 2-1.4 1.4-2.65-2.65-5.3 5.3-1.4-1.4 5.3-5.3L6.6 10l1.4-1.4 2 .35 3.45-3.45-.35-1 2.7-1.3Z"/>
      </svg>
      <div class="address" title="https://www.songstudio.live/midnight-room">
        <span>https://www.songstudio.live/mid...</span>
        <button class="address-menu" type="button" aria-label="주소 메뉴">•••</button>
      </div>
      <button class="collapse-button" type="button" aria-label="상단 바 접기">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 7.5 4.5 4.5 4.5-4.5"/></svg>
      </button>
    </header>

    <section class="game-hud" aria-label="게임 상태">
      <div class="hud-stat trust-stat">
        <span>신뢰도</span>
        <strong id="trust-display" aria-label="신뢰도 3">♥♥♥</strong>
      </div>
      <div class="hud-stat anomaly-stat">
        <span>남은 이상 시청자</span>
        <strong id="anomaly-display">3</strong>
      </div>
      <div class="hud-stat score-stat">
        <span>점수</span>
        <strong id="score-display">0000</strong>
      </div>
      <button class="help-button" id="help-button" type="button" aria-label="게임 방법">?</button>
    </section>

    <section class="message-region" aria-label="실시간 메시지">
      <ol class="message-list" id="message-list" aria-live="polite"></ol>
      <button class="new-message-button" id="new-message-button" type="button" hidden>
        새 메시지 보기
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg>
      </button>
    </section>

    <section class="chat-controls" aria-label="채팅 작성 도구">
      <button class="reward-banner" id="reward-button" type="button">
        <span class="reward-copy">1시간 시청 통나무 파워 배달 완료!</span>
        <span class="reward-amount"><span class="reward-coin" aria-hidden="true">♧</span><span id="reward-label">100 받기</span></span>
      </button>

      <div class="composer-wrap">
        <form class="composer" id="message-form">
          <span class="my-avatar" aria-hidden="true">🐹</span>
          <label class="sr-only" for="message-input">채팅 메시지</label>
          <input id="message-input" name="message" type="text" maxlength="120" autocomplete="off" aria-describedby="composer-hint">
          <button class="emoji-button" id="emoji-button" type="button" aria-label="이모지 선택" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <circle class="eye" cx="9" cy="10" r="1"/>
              <circle class="eye" cx="15" cy="10" r="1"/>
              <path d="M8.5 14c.9 1.1 2 1.7 3.5 1.7s2.6-.6 3.5-1.7"/>
            </svg>
          </button>
          <button class="send-button" type="submit" aria-label="메시지 보내기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 13-7-4 14-2.5-5.5L5 12Z"/></svg>
          </button>
        </form>

        <div class="emoji-panel" id="emoji-panel" hidden aria-label="이모지 목록">
          <button type="button">ㅋㅋㅋ</button>
          <button type="button">💚</button>
          <button type="button">🤣</button>
          <button type="button">👏</button>
          <button type="button">🔥</button>
        </div>
        <p class="sr-only" id="composer-hint">메시지를 입력한 뒤 엔터를 누르면 전송됩니다.</p>
      </div>

      <nav class="bottom-nav" aria-label="채팅 메뉴">
        <button class="support-button" id="support-button" type="button">
          <svg class="ticket-icon" viewBox="0 0 28 21" aria-hidden="true">
            <path d="M1 5.2 17 1l9.6 6.3-2 10.8-15.5 1.8-8.1-5.7 2.6-3.3L1 8.7V5.2Z"/>
            <circle cx="18.8" cy="10.3" r="2.4"/>
          </svg>
          <span>후원하기</span>
        </button>
        <button class="voice-button" id="voice-button" type="button" aria-label="음성 채팅">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M13.5 7.8c-2.5-.8-4.8.5-4.8 2.2 0 1.4 1.3 1.9 3.3 2.2 2 .3 3.3.8 3.3 2.2 0 1.7-2.2 3-4.8 2.2M12 6v12"/>
          </svg>
        </button>
        <button class="chat-tab active" id="chat-tab" type="button" aria-current="page">채팅</button>
      </nav>
    </section>

    <div class="viewer-backdrop" id="viewer-backdrop" aria-hidden="true">
      <section class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewer-name">
        <button class="panel-close" id="panel-close" type="button" aria-label="닫기">×</button>
        <p class="panel-kicker">VIEWER LOG</p>
        <h2 id="viewer-name"></h2>
        <p class="panel-help">최근 채팅 기록을 확인하고 판단하세요.</p>
        <ol class="viewer-history" id="viewer-history"></ol>
        <button class="kick-button" id="kick-button" type="button">강제 퇴장</button>
      </section>
    </div>

    <div class="game-overlay" id="game-overlay" aria-hidden="true">
      <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <p class="result-kicker" id="result-kicker">CONNECTION CLOSED</p>
        <h2 id="result-title">방송 종료</h2>
        <p id="result-copy"></p>
        <strong class="final-score" id="final-score">0000점</strong>
        <button class="restart-button" id="game-restart" type="button">다시 시작</button>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="chat-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
