<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferret Chess</title>
  <meta name="description" content="Ferret Chess를 준비하고 있습니다.">
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(99, 102, 241, 0.18), transparent 32rem),
        #0f172a;
      color: #f8fafc;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }

    .spinner {
      width: 4.5rem;
      height: 4.5rem;
      border: 0.4rem solid rgba(226, 232, 240, 0.2);
      border-top-color: #a5b4fc;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: -0.75rem 0 0;
      color: #94a3b8;
      font-size: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner" role="status" aria-label="불러오는 중"></div>
    <h1>집 짓는 중...</h1>
    <p>Ferret Chess가 곧 찾아옵니다.</p>
  </main>
</body>
</html>
